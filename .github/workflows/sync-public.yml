# Requiere el secret PUBLIC_REPO_TOKEN con contents:write sobre gomezv/portucca.
name: Sync public mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Split public subtree
        run: git subtree split --prefix=public -b public-main

      - name: Push to public repository
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          git push "https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/gomezv/portucca.git" public-main:main --force
